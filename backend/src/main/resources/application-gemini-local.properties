# Opt-in development profile. Combine with mock to keep MySQL disconnected.
openstudy.ai.provider=gemini
openstudy.ai.gemini.diagnostics-enabled=true
server.address=127.0.0.1
server.forward-headers-strategy=none
debug=false
trace=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
# Prevent framework HTTP logging of credentials, prompts, or upstream response bodies.
logging.level.org.springframework.web.client=OFF
logging.level.org.springframework.http=OFF
logging.level.sun.net.www.protocol.http=OFF
logging.level.sun.net.www.protocol.https=OFF

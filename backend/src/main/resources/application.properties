spring.application.name=openstudy

# JSP view configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Aiven connection: local credentials are supplied only through environment variables.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL:}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=JKS
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD:}
# Preserve Member 3's assignment deadline/session time zone.
spring.datasource.hikari.data-source-properties.connectionTimeZone=Asia/Kolkata
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.jackson.time-zone=Asia/Kolkata
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Optional authentication mail: accept integration MAIL_* and existing SMTP_* names.
spring.mail.host=${MAIL_HOST:${SMTP_HOST:}}
spring.mail.port=${MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SMTP_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
openstudy.auth.reset-secret=${PASSWORD_RESET_SECRET:}
openstudy.auth.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Dashboard cards remain explicitly labeled demo data; analytics uses Aiven below.
openstudy.dashboard.provider=mock
openstudy.dashboard.demo-mode=true
openstudy.dashboard.mock-scenario=populated

# One shared Groq provider. Accept both branches' provider environment names.
# No AI request occurs at startup; the mock profile explicitly selects mock AI.
openstudy.ai.provider=${OPENSTUDY_AI_PROVIDER:${AI_PROVIDER:groq}}
openstudy.ai.groq.api-key=${GROQ_API_KEY:}
openstudy.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
openstudy.ai.groq.vision-model=${GROQ_VISION_MODEL:qwen/qwen3.8-27b}
openstudy.ai.groq.base-url=https://api.groq.com/openai/v1
openstudy.ai.groq.timeout-ms=60000

# Preserve the integrated assignment/submission routes and Member 5 analytics.
openstudy.modules.dashboard-path=/teacher/dashboard
openstudy.modules.question-bank-path=/teacher/question-bank
openstudy.modules.quizzes-path=/teacher/quizzes
openstudy.modules.assignments-path=/teacher/assignments
openstudy.modules.submissions-path=/teacher/submissions
openstudy.modules.analytics-path=/teacher/analytics
openstudy.modules.profile-path=/teacher/coming-soon?module=profile
openstudy.modules.logout-path=/logout
openstudy.teacher-analytics.provider=jdbc
openstudy.teacher-analytics.r-provider=none
openstudy.teacher-analytics.demo-access=false

server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

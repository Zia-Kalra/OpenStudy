spring.application.name=openstudy

# Empty defaults allow the mock profile to start without MySQL env vars.
# The default (non-mock) profile still requires a real database connection.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL:}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=JKS
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD:}

# Auth mail and signed password-reset links. Keep all secrets in environment variables.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
openstudy.auth.reset-secret=${PASSWORD_RESET_SECRET:}
openstudy.auth.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# JSP view resolution for the teacher portal
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Dashboard data source: mock | jdbc (jdbc provider is not implemented in Phase 1)
openstudy.dashboard.provider=mock
openstudy.dashboard.demo-mode=true
openstudy.dashboard.mock-scenario=populated

# Shared AI provider: groq | mock | gemini (legacy opt-in).
# No AI call occurs at startup; an absent key only blocks explicit AI operations.
openstudy.ai.provider=${AI_PROVIDER:groq}
openstudy.ai.groq.api-key=${GROQ_API_KEY:}
openstudy.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
openstudy.ai.groq.timeout-ms=30000
# Legacy Gemini configuration is used only when the provider is explicitly gemini.
openstudy.ai.gemini.api-key=${GEMINI_API_KEY:}
openstudy.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
openstudy.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
openstudy.ai.gemini.timeout-ms=30000
# Local diagnostics are opt-in through the gemini-local profile.
openstudy.ai.gemini.diagnostics-enabled=false

# Integration paths owned by other members. Defaults are Member 5 placeholders.
openstudy.modules.dashboard-path=/teacher/dashboard
openstudy.modules.question-bank-path=/teacher/coming-soon?module=question-bank
openstudy.modules.quizzes-path=/teacher/coming-soon?module=quizzes
openstudy.modules.assignments-path=/teacher/coming-soon?module=assignments
openstudy.modules.submissions-path=/teacher/coming-soon?module=submissions
openstudy.modules.analytics-path=/teacher/analytics
openstudy.modules.profile-path=/teacher/coming-soon?module=profile
openstudy.modules.logout-path=/logout

# Teacher Analytics (Member 5); student analytics remains a separate module.
openstudy.teacher-analytics.provider=jdbc
openstudy.teacher-analytics.r-provider=none
openstudy.teacher-analytics.demo-access=false

server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

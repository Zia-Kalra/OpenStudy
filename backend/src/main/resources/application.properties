
spring.application.name=openstudy

# JSP view configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Database connection
# Empty defaults allow the mock profile to start without MySQL environment variables.
# The default (non-mock) profile still requires a real database connection.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# All live AI features use Groq on the backend; keep the API key out of browser code and source control.
openstudy.ai.groq.api-key=${GROQ_API_KEY:}
openstudy.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
openstudy.ai.groq.vision-model=${GROQ_VISION_MODEL:qwen/qwen3.8-27b}

openstudy.ai.provider=${OPENSTUDY_AI_PROVIDER:groq}

# Aiven MySQL SSL configuration
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL:}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=JKS
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD:}
# Keep DATETIME values and MySQL NOW()/CURRENT_TIMESTAMP calculations in IST.
spring.datasource.hikari.data-source-properties.connectionTimeZone=Asia/Kolkata
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.jackson.time-zone=Asia/Kolkata

# Optional SMTP settings. The application can start without email configured;
# password-reset requests require these values to send mail.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
